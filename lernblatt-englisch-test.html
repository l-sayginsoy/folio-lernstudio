<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Folio · Druckstudio</title><link rel="stylesheet" href="studio.css"><style>
body{padding:24px}.printtools,.sheet{max-width:800px;margin:0 auto 20px}.printtools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.sheet{background:#fffefb;padding:32px;border:1px solid var(--line);border-radius:12px}.sheet h1{font-size:36px;margin:12px 0}.sheet h2{margin:20px 0 10px;font-size:24px}.wline{display:grid;grid-template-columns:32px 1fr 1fr;gap:10px;align-items:end;padding:11px 0;break-inside:avoid;border-bottom:1px solid var(--line)}.line{min-height:20px;border-bottom:1px solid #7a837d}.num{color:var(--muted);font-size:12px}.sheet footer{margin-top:16px;font-size:12px}.solutions{display:grid;gap:9px}.solutions div{break-inside:avoid}label{font-weight:600}select{max-width:100%}@page{size:A4;margin:15mm}@media print{body{padding:0;background:white}.printtools{display:none}.sheet{border:0;margin:0;border-radius:0;padding:0;background:white}.sheet+.sheet{break-before:page}.wline{padding:8px 0}.sheet h2{font-size:20px}}@media(max-width:500px){body{padding:12px}.sheet{padding:18px}.wline{grid-template-columns:20px 1.1fr .9fr}}
</style></head><body><div class="printtools"><a href="index.html">← Lernstudio</a><label>Auswahl <select id="scope"><option value="mixed">Probetest · alle drei Seiten</option><option>154</option><option>155</option><option>156</option></select></label><button class="btn" id="print">Drucken</button><button class="ghost" id="mix">Neu mischen</button></div><div id="sheets"></div><script src="words.js"></script><script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){const p=document.querySelector('#scope').value;
const cards=p==='mixed'?shuffled([154,155,156].flatMap(n=>shuffled(WORDS.filter(w=>w.page===n)).slice(0,3))):shuffled(WORDS.filter(w=>w.page===Number(p))).slice(0,10);
const title=p==='mixed'?'Probetest':'Schreibtraining · Seite '+p;
document.querySelector('#sheets').innerHTML='<section class="sheet"><div class="eyebrow">Folio / Englisch · S. 154–156</div><h1>'+title+'</h1><p>Schreibe die englischen Wörter oder Sätze aus dem Kopf. Lass eine Zeile frei, wenn dir die Antwort noch fehlt.</p>'+cards.map((w,i)=>'<div class="wline"><span class="num">'+(i+1)+'</span><span>'+esc(w.prompt)+'</span><span class="line"></span></div>').join('')+'<footer>Die Lösungen stehen auf dem zweiten Blatt.</footer></section><section class="sheet"><div class="eyebrow">Folio / Selbstkontrolle</div><h1>Lösungen</h1><div class="solutions">'+cards.map((w,i)=>'<div><b>'+(i+1)+'. '+esc(w.en)+'</b> · '+esc(w.de)+(w.ans.length>1?'<p class="caption">Auch möglich: '+w.ans.slice(1).map(esc).join(' · ')+'</p>':'')+'</div>').join('')+'</div><footer>Ausgeschriebene Formen und passende Kurzformen gelten gleichwertig.</footer></section>'}
document.querySelector('#scope').onchange=draw;document.querySelector('#mix').onclick=draw;document.querySelector('#print').onclick=()=>window.print();draw()
</script></body></html>
